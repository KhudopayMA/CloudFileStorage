#        echo 'Waiting for MinIO...';
#        sleep 1;
#      done;
#      mc mb --ignore-existing minio/user-files;
#      exit 0;
#      "

  cloud_file_storage:
    container_name: cloud-file-storage
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    image:
      cloud_file_storage:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "${APP_PORT}:8000"


volumes:
  db_data:
  minio_data:
