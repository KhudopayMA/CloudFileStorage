name: cloud-file-storage

services:
  postgres:
    container_name: cloud-file-storage-db
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]


  redis:
    container_name:  cloud-file-storage-redis
    image: redis:8.10.0
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD",  "redis-cli -a $REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
