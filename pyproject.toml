[project]
name = "cloud-file-storage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.80",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.0.7",
    "django-test-plus>=2.6.2",
    "djangorestframework-stubs[compatible-mypy]>=3.17.0",
    "factory-boy>=3.3.3",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
    "typos>=1.48.0",
]

[tool.mypy]
strict = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
module = "test_plus.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
omit = [
    "*/config/*",
    "*/migrations/*",
    "__init__.py",
    "urls.py",
    "manage.py",
    "models.py",
    "apps.py",
    "admin.py"
]
